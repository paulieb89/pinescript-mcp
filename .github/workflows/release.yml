name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true

  deploy:
    name: Deploy to Fly
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  sync-dashboard:
    name: Sync Grafana Dashboard
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && (needs.deploy.result == 'success' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Push dashboard to fly-metrics.net
        env:
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          payload=$(jq \
            --arg msg "Auto-sync from release $REF_NAME" \
            '{dashboard: (. | del(.id)), overwrite: true, message: $msg}' \
            dashboard.json)
          curl -sf \
            -H "Authorization: Bearer $GRAFANA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            https://fly-metrics.net/api/dashboards/db

