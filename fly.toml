# fly.toml app configuration file generated for pinescript-mcp on 2026-02-13T13:24:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pinescript-mcp'
primary_region = 'sjc'

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  [http_service.concurrency]
    type = "connections"
    soft_limit = 25
    hard_limit = 50

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[metrics]
  port = 8080
  path = "/metrics"
